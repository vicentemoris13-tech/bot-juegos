name: Bot Ofertas
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install python-telegram-bot requests
      - name: Ejecutar bot
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CANAL_ID: ${{ secrets.CANAL_ID }}
